# =============================================================================
# Opes HealthCore SDK — Quickstart Host Multi-DB & OIDC Configuration
# Author / Architect : Jude Nshome — Opes Health Systems (nshome@opesware.com)
# Website            : https://www.opeshealthsystems.com | Douala, Cameroon
# =============================================================================
server:
  port: 3000
  compression:
    enabled: true
    min-response-size: 1024
    mime-types:
      - application/json
      - application/fhir+json
      - application/fhir+ndjson
      - application/xml
      - text/csv

spring:
  application:
    name: opes-healthcore-quickstart
  threads:
    virtual:
      enabled: true # Java 25 Project Loom Virtual Threads
  profiles:
    active: postgres,keycloak
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        default_batch_fetch_size: 32
        order_inserts: true
        order_updates: true
  liquibase:
    enabled: ${HEALTHCORE_LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.xml
  flyway:
    enabled: ${HEALTHCORE_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "Opes HealthCore multi-RDBMS baseline"
    validate-on-migrate: true
    out-of-order: false
    table: flyway_schema_history
    locations: classpath:db/migration/{vendor}
  graphql:
    http:
      path: /graphql
    schema:
      locations: classpath:graphql/
      file-extensions: .graphqls,.gqls
    graphiql:
      enabled: ${HEALTHCORE_GRAPHIQL_ENABLED:false}
      path: /graphiql

healthcore:
  security:
    rate-limit:
      enabled: ${HEALTHCORE_RATE_LIMIT_ENABLED:true}
      fhir-requests-per-minute: ${HEALTHCORE_RATE_LIMIT_FHIR_RPM:120}
      bundle-requests-per-minute: ${HEALTHCORE_RATE_LIMIT_BUNDLE_RPM:30}
      anonymous-requests-per-minute: ${HEALTHCORE_RATE_LIMIT_ANON_RPM:60}
      refill-period-seconds: 60
      max-cached-buckets: 10000
  postgres:
    rls:
      enabled: false # Set true after applying postgres/enable-rls-policies.sql with non-superuser DB role
    notify:
      enabled: false # Set true for zero-broker PostgreSQL LISTEN/NOTIFY outbox fanout
  cache:
    redis:
      enabled: false # Set true with spring-boot-starter-data-redis for L1 Caffeine + L2 Redis + Pub/Sub invalidation
  outbox:
    enabled: true
    kafka:
      enabled: false # Set true when Apache Kafka broker is configured
    rabbitmq:
      enabled: false # Set true when RabbitMQ AMQP broker is configured
  coldchain:
    mqtt:
      enabled: false # Set true with Eclipse Paho broker for 2C-8C WHO PQS fridge telemetry
      broker-url: ${HEALTHCORE_MQTT_URL:tcp://localhost:1883}
      topic: ${HEALTHCORE_MQTT_TOPIC:healthcore/+/coldchain/#}
      client-id: ${HEALTHCORE_MQTT_CLIENT_ID:healthcore-coldchain-subscriber}
  workflow:
    sla-scan-interval-ms: 60000 # Scans overdue ACTIVE workflow instances via PostgreSQL partial index
  dhis2:
    enabled: false # Set true with DHIS2 /api/dataValueSets & /api/tracker endpoint
    base-url: ${HEALTHCORE_DHIS2_URL:}
    username: ${HEALTHCORE_DHIS2_USER:}
    password: ${HEALTHCORE_DHIS2_PASSWORD:}
    sync-interval-ms: 300000
  terminology:
    remote-sync:
      enabled: false # Set true to expand/cache ValueSets from external FHIR Terminology Server
      fhir-server-url: ${HEALTHCORE_FHIR_TERMINOLOGY_URL:}
      interval-ms: 86400000
  hie:
    subscription-relay:
      enabled: true # Auto-relays Outbox domain events to matching ACTIVE FHIR Subscriptions
    dicom:
      pacs-enabled: false # Set true with Orthanc/DCM4CHEE DICOMweb base URL
      pacs-base-url: ${HEALTHCORE_PACS_DICOMWEB_URL:}
    mllp:
      enabled: false # Enable via -Dhealthcore.hie.mllp.enabled=true to bind HL7v2 TCP listener
      port: 2575
  ai:
    enabled: ${HEALTHCORE_AI_ENABLED:true}
    api-key: ${GEMINI_API_KEY:}
    text-model: ${HEALTHCORE_AI_TEXT_MODEL:gemini-4-hydrogen}
    transcribe-model: ${HEALTHCORE_AI_TRANSCRIBE_MODEL:gemini-3.5-transcribe}
    tts-model: ${HEALTHCORE_AI_TTS_MODEL:gemini-3.8-flash-lite-tts}
    embedding-model: ${HEALTHCORE_AI_EMBEDDING_MODEL:gemini-embedding-2}
    decisions-model: ${HEALTHCORE_AI_DECISIONS_MODEL:gemini-decision-1}
    enforce-safe-harbor-redaction: ${HEALTHCORE_AI_ENFORCE_SAFE_HARBOR_REDACTION:true}
    require-clinician-attestation: ${HEALTHCORE_AI_REQUIRE_CLINICIAN_ATTESTATION:true}
    connect-timeout-seconds: 15
    request-timeout-seconds: 60
    max-retries: 3

springdoc:
  default-produces-media-type: application/fhir+json
  default-consumes-media-type: application/fhir+json
  show-actuator: true
  swagger-ui:
    enabled: ${HEALTHCORE_SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  api-docs:
    enabled: ${HEALTHCORE_OPENAPI_ENABLED:true}
    path: /v3/api-docs

resilience4j:
  circuitbreaker:
    instances:
      hieExternal:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
      hieWebhook:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      dhis2Outbound:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      pacsProxy:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
      terminologyRemote:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
  bulkhead:
    instances:
      hieOutbound:
        max-concurrent-calls: 25
        max-wait-duration: 500ms
  timelimiter:
    instances:
      hieWebhook:
        timeout-duration: 8s
  retry:
    instances:
      sqlTransient:
        max-attempts: 3
        wait-duration: 150ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${HEALTHCORE_DB_URL:jdbc:postgresql://localhost:5432/healthcore}
    username: ${HEALTHCORE_DB_USER:healthcore_app}
    password: ${HEALTHCORE_DB_PASSWORD:change_me_in_prod}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration/postgresql

---
spring:
  config:
    activate:
      on-profile: mssql
  datasource:
    url: ${HEALTHCORE_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=healthcore;encrypt=true;trustServerCertificate=true}
    username: ${HEALTHCORE_DB_USER:sa}
    password: ${HEALTHCORE_DB_PASSWORD:OpesHealth!2026Strong}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  flyway:
    locations: classpath:db/migration/sqlserver

---
# Windows Server Active Directory Integrated Authentication (Kerberos / NTLM)
spring:
  config:
    activate:
      on-profile: mssql-integrated
  datasource:
    url: ${HEALTHCORE_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=healthcore;integratedSecurity=true;encrypt=true;trustServerCertificate=true}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  flyway:
    locations: classpath:db/migration/sqlserver

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${HEALTHCORE_DB_URL:jdbc:mysql://localhost:3306/healthcore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${HEALTHCORE_DB_USER:healthcore_app}
    password: ${HEALTHCORE_DB_PASSWORD:change_me_in_prod}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    locations: classpath:db/migration/mysql

---
spring:
  config:
    activate:
      on-profile: keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/opes-healthcore}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8085/realms/opes-healthcore/protocol/openid-connect/certs}

healthcore:
  security:
    keycloak:
      enabled: true
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/opes-healthcore}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8085/realms/opes-healthcore/protocol/openid-connect/certs}
      client-id: ${KEYCLOAK_CLIENT_ID:healthcore-mobile-kmp}
      allowed-origins: ${KEYCLOAK_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8085}
  smart:
    authorization-endpoint: ${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/opes-healthcore}/protocol/openid-connect/auth
    token-endpoint: ${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/opes-healthcore}/protocol/openid-connect/token
    introspection-endpoint: ${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/opes-healthcore}/protocol/openid-connect/token/introspect
    revocation-endpoint: ${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/opes-healthcore}/protocol/openid-connect/revoke

---
spring:
  config:
    activate:
      on-profile: auth0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://your-tenant.us.auth0.com/}
          audiences: ${AUTH0_AUDIENCE:https://api.opeshealthsystems.com}

---
# Mutual TLS (X.509 Client Auth) profile for National HIE / Inter-Facility Gateways
spring:
  config:
    activate:
      on-profile: mtls
server:
  ssl:
    enabled: true
    client-auth: need
    key-store: ${HEALTHCORE_SSL_KEYSTORE:classpath:certs/healthcore-server.p12}
    key-store-password: ${HEALTHCORE_SSL_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    trust-store: ${HEALTHCORE_SSL_TRUSTSTORE:classpath:certs/healthcore-truststore.p12}
    trust-store-password: ${HEALTHCORE_SSL_TRUSTSTORE_PASSWORD:changeit}
    trust-store-type: PKCS12
