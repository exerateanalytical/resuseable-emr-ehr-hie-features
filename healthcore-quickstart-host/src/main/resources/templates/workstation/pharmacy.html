<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar(${activeNav}, ${facility})}"></aside>
    <main class="workspace-main">
        <header th:replace="~{fragments/layout :: topbar(${pageTitle}, ${facility})}"></header>
        <div class="content-body">
            <div th:replace="~{fragments/layout :: flashes}"></div>

            <div class="grid-two">
                <section class="panel">
                    <div class="panel-header">
                        <h2 class="panel-title">Medication Inventory Batches (Atomic FEFO)</h2>
                    </div>
                    <div th:if="${#lists.isEmpty(batches)}" class="empty-state">
                        No pharmacy stock batches registered in this facility.
                    </div>
                    <table class="data-table" th:if="${!#lists.isEmpty(batches)}">
                        <thead>
                        <tr>
                            <th>Drug Code</th>
                            <th>Medication</th>
                            <th>Lot</th>
                            <th>Expiry</th>
                            <th class="num">On Hand</th>
                            <th>Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="b : ${batches}">
                            <td class="mono" th:text="${b.drugCode}">RX-AMOX-500</td>
                            <td th:text="${b.drugName}">Amoxicillin 500mg</td>
                            <td class="mono" th:text="${b.lotNumber}">LOT-CM-2026-A</td>
                            <td class="mono" th:text="${b.expiryDate}">2027-09-01</td>
                            <td class="mono num" th:text="${b.quantityOnHand}">240</td>
                            <td>
                                <span class="status-tag" th:classappend="${b.quarantined} ? ' status-crit' : (${b.quantityOnHand <= b.reorderThreshold} ? ' status-warn' : ' status-ok')"
                                      th:text="${b.quarantined ? 'QUARANTINED' : (b.quantityOnHand <= b.reorderThreshold ? 'LOW_STOCK' : 'AVAILABLE')}">AVAILABLE</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </section>

                <section class="panel">
                    <div class="panel-header">
                        <h2 class="panel-title">Dispense Medication (FEFO)</h2>
                    </div>
                    <div class="panel-body">
                        <form th:action="@{/ui/pharmacy/dispense}" method="post" class="form-grid">
                            <div class="form-field full">
                                <label>Patient</label>
                                <select name="patientId" required>
                                    <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.mrn + ' — ' + p.familyName + ', ' + p.givenName}"></option>
                                </select>
                            </div>
                            <div class="form-field">
                                <label>Drug Code</label>
                                <select name="drugCode" required>
                                    <option th:each="b : ${batches}" th:value="${b.drugCode}" th:text="${b.drugCode + ' — ' + b.drugName}"></option>
                                </select>
                            </div>
                            <div class="form-field">
                                <label>Quantity</label>
                                <input type="number" name="quantity" value="10" min="1" required/>
                            </div>
                            <div class="form-field full">
                                <button type="submit" class="btn btn-primary">Dispense Atomically</button>
                            </div>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </main>
</div>
</body>
</html>
