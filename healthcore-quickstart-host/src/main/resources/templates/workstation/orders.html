<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar(${activeNav}, ${facility})}"></aside>
    <main class="workspace-main">
        <header th:replace="~{fragments/layout :: topbar(${pageTitle}, ${facility})}"></header>
        <div class="content-body">
            <div th:replace="~{fragments/layout :: flashes}"></div>

            <div class="grid-two">
                <section class="panel">
                    <div class="panel-header">
                        <h2 class="panel-title">Unified Orders Queue (Lab / Imaging / Meds / Procedures)</h2>
                    </div>
                    <div th:if="${#lists.isEmpty(orders)}" class="empty-state">
                        No clinical orders placed yet.
                    </div>
                    <table class="data-table" th:if="${!#lists.isEmpty(orders)}">
                        <thead>
                        <tr>
                            <th>Domain</th>
                            <th>Code</th>
                            <th>Order Display</th>
                            <th>Priority</th>
                            <th>Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="o : ${orders}">
                            <td class="mono" th:text="${o.orderDomain}">LABORATORY</td>
                            <td class="mono" th:text="${o.orderCode}">2823-3</td>
                            <td th:text="${o.orderDisplay}">Serum Potassium</td>
                            <td>
                                <span class="status-tag" th:classappend="${o.priority.name() == 'STAT'} ? ' status-crit' : (${o.priority.name() == 'URGENT'} ? ' status-warn')" th:text="${o.priority}">STAT</span>
                            </td>
                            <td>
                                <span class="status-tag" th:classappend="${o.status.name() == 'VERIFIED'} ? ' status-ok'" th:text="${o.status}">ORDERED</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </section>

                <div>
                    <section class="panel">
                        <div class="panel-header"><h2 class="panel-title">Place Unified Order</h2></div>
                        <div class="panel-body">
                            <form th:action="@{/ui/orders}" method="post" class="form-grid">
                                <div class="form-field full">
                                    <label>Patient</label>
                                    <select name="patientId" required>
                                        <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.mrn + ' — ' + p.familyName + ', ' + p.givenName}"></option>
                                    </select>
                                </div>
                                <div class="form-field">
                                    <label>Order Domain</label>
                                    <select name="orderDomain">
                                        <option th:each="d : ${domains}" th:value="${d}" th:text="${d}"></option>
                                    </select>
                                </div>
                                <div class="form-field">
                                    <label>Priority</label>
                                    <select name="priority">
                                        <option th:each="pr : ${priorities}" th:value="${pr}" th:text="${pr}"></option>
                                    </select>
                                </div>
                                <div class="form-field">
                                    <label>LOINC / Code</label>
                                    <input type="text" name="orderCode" required placeholder="2823-3"/>
                                </div>
                                <div class="form-field">
                                    <label>Display Name</label>
                                    <input type="text" name="orderDisplay" required placeholder="Serum Potassium"/>
                                </div>
                                <div class="form-field full">
                                    <label>Clinical Notes</label>
                                    <input type="text" name="clinicalNotes" placeholder="Indication / instructions"/>
                                </div>
                                <div class="form-field full">
                                    <button type="submit" class="btn btn-primary">Sign &amp; Place Order</button>
                                </div>
                            </form>
                        </div>
                    </section>

                    <section class="panel">
                        <div class="panel-header"><h2 class="panel-title">Enter &amp; Verify Lab Result</h2></div>
                        <div class="panel-body">
                            <form th:action="@{/ui/orders/results}" method="post" class="form-grid">
                                <div class="form-field full">
                                    <label>Target Order</label>
                                    <select name="orderId" required>
                                        <option th:each="o : ${orders}" th:value="${o.id}" th:text="${o.orderCode + ' — ' + o.orderDisplay + ' (' + o.status + ')'}"></option>
                                    </select>
                                </div>
                                <div class="form-field">
                                    <label>Result Code</label>
                                    <input type="text" name="resultCode" required placeholder="2823-3"/>
                                </div>
                                <div class="form-field">
                                    <label>Result Display</label>
                                    <input type="text" name="resultDisplay" required placeholder="Serum Potassium"/>
                                </div>
                                <div class="form-field">
                                    <label>Numeric Value</label>
                                    <input type="number" step="0.01" name="numericValue" required/>
                                </div>
                                <div class="form-field">
                                    <label>UCUM Unit</label>
                                    <input type="text" name="unit" placeholder="mmol/L"/>
                                </div>
                                <div class="form-field full">
                                    <label>Abnormal Flag</label>
                                    <select name="abnormalFlag">
                                        <option th:each="f : ${abnormalFlags}" th:value="${f}" th:text="${f}"></option>
                                    </select>
                                </div>
                                <div class="form-field full">
                                    <button type="submit" class="btn btn-primary">Verify Final Result</button>
                                </div>
                            </form>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
