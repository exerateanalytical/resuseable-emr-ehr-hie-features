name: HealthCore JDK 25 Multi-DB & Assurance CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-tests:
    name: Build & Unit Tests (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Maven build, dependency convergence, and unit/regression test suite
        run: |
          mvn -B -ntp dependency:tree -DoutputFile=target/dependency-tree.txt
          mvn -B -ntp -fae clean verify -DskipITs=true

      - name: Generate release SHA-256 checksums and optional artifact signature
        run: bash scripts/ci-verify-docs-and-sign.sh target/release-attestation

      - name: Upload release attestation artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-attestation
          path: target/release-attestation/**

      - name: Upload Surefire test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'

  multi-db-migration-integration:
    name: Multi-DB Liquibase & Testcontainers IT (PostgreSQL / MSSQL / MySQL)
    runs-on: ubuntu-latest
    needs: build-and-unit-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run MultiDbTestcontainersIT and PatientJourneyPostgresIT against PostgreSQL, SQL Server, and MySQL
        run: mvn -B -ntp verify -pl healthcore-quickstart-host -am -Dit.test=MultiDbTestcontainersIT,PatientJourneyPostgresIT -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false -Dfailsafe.failIfNoSpecifiedTests=false

      - name: Upload Failsafe integration reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: '**/target/failsafe-reports/**'

  security-and-documentation-guardrails:
    name: Security, Migration, Secret & Assurance Doc Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run repository static security, migration, and documentation guardrails
        run: |
          python3 - <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET

          errors = []
          root = pathlib.Path('.')

          # 1. Zero auth bypasses, hardcoded secrets, swallowed AI audit failures
          for p in root.rglob('*.java'):
              if '/src/main/' not in p.as_posix():
                  continue
              text = p.read_text(encoding='utf-8')
              if 'or isAuthenticated()' in text:
                  errors.append(f'Auth bypass pattern found in {p}')
              for forbidden_secret in [
                  'opes-hie-webhook-secret',
                  'opes-momo-dev-secret',
                  'opes-uhc-offline-qr-key-v1',
                  'opes-webhook-secret',
              ]:
                  if forbidden_secret in text:
                      errors.append(f'Hardcoded fallback secret "{forbidden_secret}" found in {p}')
              if p.name in {'ClinicalAiGovernanceService.java', 'ClinicalAuditLogger.java'} and 'catch (Exception ignored)' in text:
                  errors.append(f'Swallowed audit exception found in {p}')

          # 2. Pure Java enforcement (no Node/TS build files)
          for forbidden in ['package.json', 'tsconfig.json', 'vite.config.ts', 'vite.config.js']:
              if (root / forbidden).exists():
                  errors.append(f'Forbidden Node/TS artifact found: {forbidden}')

          # 3. Liquibase sole ownership (verify all master includes exist)
          master = root / 'healthcore-quickstart-host/src/main/resources/db/changelog/db.changelog-master.xml'
          tree = ET.parse(master)
          res_roots = [p for p in root.glob('*/src/main/resources') if p.is_dir()]
          for elem in tree.iter():
              if elem.tag.endswith('include') and 'file' in elem.attrib:
                  rel = elem.attrib['file'].removeprefix('classpath:')
                  if not any((rr / rel).is_file() for rr in res_roots):
                      errors.append(f'Missing Liquibase include: {rel}')

          # 4. Non-empty AutoConfiguration.imports across all starters
          for imp in root.rglob('AutoConfiguration.imports'):
              if imp.stat().st_size == 0:
                  errors.append(f'Empty AutoConfiguration.imports: {imp}')

          # 5. Required Phase 9 governance & operations documentation
          required_docs = [
              'README.md',
              'docs/DEVELOPER_GUIDE.md',
              'docs/ARCHITECTURE_DECISION_RECORDS.md',
              'docs/THREAT_MODEL.md',
              'docs/CLINICAL_SAFETY_CASE.md',
              'docs/PRIVACY_IMPACT_ASSESSMENT.md',
              'docs/DATA_DICTIONARY.md',
              'docs/API_CONFORMANCE_REPORT.md',
              'docs/DATABASE_MIGRATION_GUIDE.md',
              'docs/PRODUCTION_RUNBOOK.md',
              'docs/INCIDENT_RESPONSE_PLAN.md',
              'docs/KNOWN_LIMITATIONS_REGISTER.md',
          ]
          for doc in required_docs:
              dp = root / doc
              if not dp.is_file() or dp.stat().st_size < 100:
                  errors.append(f'Missing or incomplete required document: {doc}')

          # 6. Every Maven reactor module must have a non-empty README.md
          pom_tree = ET.parse(root / 'pom.xml')
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          modules = [m.text.strip() for m in pom_tree.findall('.//m:modules/m:module', ns) if m.text]
          for mod in modules:
              mod_readme = root / mod / 'README.md'
              if not mod_readme.is_file() or mod_readme.stat().st_size < 100:
                  errors.append(f'Missing or incomplete module README.md: {mod}/README.md')

          # 7. Required container and disaster-recovery scripts
          for ops_file in [
              'Dockerfile',
              'scripts/backup-postgres.sh',
              'scripts/restore-drill-verify.sh',
              'scripts/ci-verify-docs-and-sign.sh',
          ]:
              if not (root / ops_file).is_file():
                  errors.append(f'Missing production container/DR artifact: {ops_file}')

          # 8. Universal SDK Deliverables (10 root docs + 8 pack manifests + 11 standalone examples)
          for sdk_doc in [
              'HEALTHCORE_MODULE_INVENTORY.md',
              'HEALTHCORE_DEPENDENCY_MATRIX.md',
              'HEALTHCORE_CAPABILITY_PACKS.md',
              'HEALTHCORE_INDUSTRY_WORKFLOW_CATALOG.md',
              'HEALTHCORE_PUBLIC_API_CATALOG.md',
              'HEALTHCORE_EXTENSION_POINT_REGISTER.md',
              'HEALTHCORE_STANDARDS_APPLICABILITY_MATRIX.md',
              'HEALTHCORE_INTEGRATION_GUIDE_INDEX.md',
              'HEALTHCORE_TEST_EVIDENCE_REGISTER.md',
              'HEALTHCORE_RELEASE_READINESS.md',
          ]:
              sp = root / sdk_doc
              if not sp.is_file() or sp.stat().st_size < 100:
                  errors.append(f'Missing or incomplete SDK deliverable: {sdk_doc}')

          import json
          for pack_dir in sorted((root / 'packs').glob('healthcore-pack-*')):
              mf = pack_dir / 'src/main/resources/META-INF/healthcore/pack-manifest.json'
              if not mf.is_file():
                  errors.append(f'Missing pack-manifest.json in {pack_dir}')
              else:
                  json.loads(mf.read_text(encoding='utf-8'))

          example_poms = sorted((root / 'examples').glob('*/pom.xml'))
          if len(example_poms) < 11:
              errors.append(f'Expected 11 standalone examples under examples/, found {len(example_poms)}')

          if errors:
              print('\n'.join(errors), file=sys.stderr)
              sys.exit(1)
          print(f'All static security, migration, DR, {len(modules)}-module, 8-pack, and {len(example_poms)}-example guardrails passed.')
          PY

  container-build:
    name: Hardened Java 25 Container Image Build
    runs-on: ubuntu-latest
    needs: [ build-and-unit-tests, security-and-documentation-guardrails ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build hardened quickstart-host container image
        run: docker build --tag opes-healthcore/quickstart-host:ci-${{ github.sha }} .

  mobile-kmp-check:
    name: Android Kotlin Multiplatform actual compile (JDK 17 / SDK 35)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android Gradle Plugin 8.8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.10.2 (no wrapper present in repository)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK and accept required licenses
        uses: android-actions/setup-android@v4

      - name: Install Android 35 build platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Actually compile HealthCore Kotlin Android SDK
        run: gradle -p healthcore-mobile-kmp :healthcore-mobile-sdk:assembleDebug --no-daemon --stacktrace

  java25-devcontainer-check:
    name: Build Java 25 Maven devcontainer and validate Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate developer Compose file
        run: docker compose -f .devcontainer/docker-compose.yml config --quiet

      - name: Build developer environment image
        run: docker build -f .devcontainer/Dockerfile -t opes-healthcore/dev:ci .

      - name: Assert Java 25, Maven and Docker tooling are installed
        run: docker run --rm opes-healthcore/dev:ci bash -lc 'java -version && mvn -version && docker --version'

  run-22-test-suites:
    name: Run 22 Module Test Suites & JaCoCo Coverage (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run all 22 core, platform, and specialty starter test suites with JaCoCo
        run: |
          MODULES=(
            healthcore-starter-scheduling
            healthcore-starter-orders-results
            healthcore-starter-radiology
            healthcore-starter-emergency-nursing
            healthcore-starter-patient-portal
            healthcore-starter-workflow-engine
            healthcore-starter-analytics
            healthcore-starter-api-product
            healthcore-starter-templates-dashboards
            healthcore-starter-blood-bank
            healthcore-starter-surgery-ot
            healthcore-starter-biomedical-coldchain
            healthcore-starter-chw-homecare
            healthcore-starter-crvs-mortuary
            healthcore-starter-deidentification-research
            healthcore-starter-disease-surveillance
            healthcore-starter-fhir-hie
            healthcore-starter-hl7-astm-dicom
            healthcore-starter-interoperability-ihe
            healthcore-starter-lis-diagnostics
            healthcore-starter-pharmacy-inventory
            healthcore-starter-programs-immunization
          )
          TESTS=(
            SchedulingServiceTest
            UnifiedOrdersResultsServiceTest
            RadiologyRisServiceTest
            EmergencyNursingServiceTest
            PatientPortalServiceTest
            WorkflowOrchestrationServiceTest
            HospitalAnalyticsServiceTest
            ApiProductServiceTest
            TemplatesAndOperationsServiceTest
            BloodBankCompatibilityTest
            SurgicalPerioperativeTest
            BiomedicalColdChainStarterTest
            ChwHomeCareStarterTest
            CrvsMortuaryStarterTest
            DeidentificationResearchStarterTest
            DiseaseSurveillanceStarterTest
            FhirHieStarterTest
            Hl7AstmDicomFixtureTest
            IheProfileFixtureTest
            LisDiagnosticsStarterTest
            PharmacyInventoryStarterTest
            ProgramsImmunizationStarterTest
          )
          MODULE_LIST=$(IFS=,; echo "${MODULES[*]}")
          TEST_LIST=$(IFS=,; echo "${TESTS[*]}")
          mvn -B -ntp -fae test jacoco:report -pl "${MODULE_LIST}" -am -Dtest="${TEST_LIST}" -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false

      - name: Run Queue Management, Patient Journey (Tests A-J), HealthCoreDataFixture & WorkflowVerificationService suites
        run: |
          mvn -B -ntp -fae test jacoco:report \
            -pl healthcore-persistence-core,healthcore-starter-integration-ops,healthcore-starter-revenue-coding-claims,healthcore-starter-queue-management,healthcore-testing \
            -am \
            -Dtest="CapabilityPackIsolationTest,IntegrationOpsServiceTest,RevenueCodingClaimsServiceTest,QueueManagementServiceTest,HealthCoreDataFixtureTest,WorkflowVerificationServiceTest,PatientJourneyEndToEndAcceptanceTest" \
            -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload 22-suite Surefire XML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-surefire-22-test-suites
          path: |
            healthcore-starter-*/target/surefire-reports/TEST-*.xml
            healthcore-testing/target/surefire-reports/TEST-*.xml
          if-no-files-found: warn

      - name: Upload 22-module JaCoCo XML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-jacoco-22-module-reports
          path: |
            healthcore-starter-*/target/site/jacoco/jacoco.xml
            healthcore-testing/target/site/jacoco/jacoco.xml
          if-no-files-found: warn

  coverage-report:
    name: JaCoCo 22-Module Coverage Summary & PR Comment
    runs-on: ubuntu-latest
    needs: [ run-22-test-suites ]
    if: always()
    steps:
      - name: Download 22-suite Surefire XML reports
        uses: actions/download-artifact@v4
        with:
          name: ci-surefire-22-test-suites
          path: ci-coverage/surefire
        continue-on-error: true

      - name: Download 22-module JaCoCo XML reports
        uses: actions/download-artifact@v4
        with:
          name: ci-jacoco-22-module-reports
          path: ci-coverage/jacoco
        continue-on-error: true

      - name: Generate JaCoCo 22-module visual coverage summary
        shell: bash
        env:
          SUITE_JOB_STATUS: ${{ needs.run-22-test-suites.result }}
        run: |
          python3 - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET

          MODULES_22 = [
              "healthcore-starter-scheduling",
              "healthcore-starter-orders-results",
              "healthcore-starter-radiology",
              "healthcore-starter-emergency-nursing",
              "healthcore-starter-patient-portal",
              "healthcore-starter-workflow-engine",
              "healthcore-starter-analytics",
              "healthcore-starter-api-product",
              "healthcore-starter-templates-dashboards",
              "healthcore-starter-blood-bank",
              "healthcore-starter-surgery-ot",
              "healthcore-starter-biomedical-coldchain",
              "healthcore-starter-chw-homecare",
              "healthcore-starter-crvs-mortuary",
              "healthcore-starter-deidentification-research",
              "healthcore-starter-disease-surveillance",
              "healthcore-starter-fhir-hie",
              "healthcore-starter-hl7-astm-dicom",
              "healthcore-starter-interoperability-ihe",
              "healthcore-starter-lis-diagnostics",
              "healthcore-starter-pharmacy-inventory",
              "healthcore-starter-programs-immunization",
          ]

          def bar(pct: float, width: int = 10) -> str:
              filled = max(0, min(width, round(pct / 100.0 * width)))
              return ("█" * filled) + ("░" * (width - filled))

          def parse_jacoco(xml_path: pathlib.Path):
              counters = {}
              if not xml_path.is_file():
                  return counters
              root = ET.parse(xml_path).getroot()
              for c in root.findall("counter"):
                  counters[c.attrib.get("type")] = (
                      int(c.attrib.get("covered", "0")),
                      int(c.attrib.get("missed", "0")),
                  )
              return counters

          def parse_surefire(mod_dir: pathlib.Path):
              tests = failures = errors = skipped = 0
              if not mod_dir.is_dir():
                  return tests, failures, errors, skipped
              for xf in mod_dir.glob("TEST-*.xml"):
                  root = ET.parse(xf).getroot()
                  tests += int(root.attrib.get("tests", "0"))
                  failures += int(root.attrib.get("failures", "0"))
                  errors += int(root.attrib.get("errors", "0"))
                  skipped += int(root.attrib.get("skipped", "0"))
              return tests, failures, errors, skipped

          def pct(cov: int, miss: int) -> float:
              total = cov + miss
              return (100.0 * cov / total) if total > 0 else 0.0

          surefire_root = pathlib.Path("ci-coverage/surefire")
          jacoco_root = pathlib.Path("ci-coverage/jacoco")

          rows = []
          completed = 0
          total_tests = total_fail = total_err = 0
          tot_lc = tot_lm = tot_ic = tot_im = tot_bc = tot_bm = 0

          for mod in MODULES_22:
              t, f, e, _ = parse_surefire(surefire_root / mod / "target" / "surefire-reports")
              total_tests += t; total_fail += f; total_err += e
              passed = (t > 0 and f == 0 and e == 0)
              if passed:
                  completed += 1
              counters = parse_jacoco(jacoco_root / mod / "target" / "site" / "jacoco" / "jacoco.xml")
              lc, lm = counters.get("LINE", (0, 0))
              ic, im = counters.get("INSTRUCTION", (0, 0))
              bc, bm = counters.get("BRANCH", (0, 0))
              tot_lc += lc; tot_lm += lm; tot_ic += ic; tot_im += im; tot_bc += bc; tot_bm += bm
              lp, ip, bp = pct(lc, lm), pct(ic, im), pct(bc, bm)
              status = "✅ PASS" if passed else ("❌ FAIL" if t > 0 else "⚠️ NO REPORT")
              rows.append(f"| `{mod}` | {status} | {t} ({f}F/{e}E) | `{bar(lp)}` **{lp:.1f}%** | {ip:.1f}% | {bp:.1f}% |")

          comp_pct = 100.0 * completed / len(MODULES_22)
          agg_l, agg_i, agg_b = pct(tot_lc, tot_lm), pct(tot_ic, tot_im), pct(tot_bc, tot_bm)
          suite_status = os.environ.get("SUITE_JOB_STATUS", "unknown")

          report = "\n".join([
              "<!-- healthcore-ci-jacoco-coverage-report -->",
              "## OPES HealthCore CI — 22-Module Test Suite & JaCoCo Coverage Summary",
              "",
              f"**22-Module Suite Completion:** `{bar(comp_pct, 20)}` **{completed}/{len(MODULES_22)} ({comp_pct:.0f}%)**",
              "",
              "| Metric | Status / Bar | Value |",
              "|---|---|---|",
              f"| 22 Module Test Suites (`run-22-test-suites`) | `{suite_status}` | **{total_tests}** tests ({total_fail} failures, {total_err} errors) |",
              f"| Aggregate JaCoCo Line Coverage | `{bar(agg_l)}` | **{agg_l:.1f}%** ({tot_lc}/{tot_lc + tot_lm} lines) |",
              f"| Aggregate JaCoCo Instruction / Branch | `{bar(agg_i)}` | **{agg_i:.1f}%** instructions · **{agg_b:.1f}%** branches |",
              "",
              "| Module | Suite Status | Tests | Line Coverage | Instruction | Branch |",
              "|---|---|---:|---|---:|---:|",
              *rows,
          ]) + "\n"

          pathlib.Path("ci-coverage-summary.md").write_text(report, encoding="utf-8")
          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_file:
              with open(summary_file, "a", encoding="utf-8") as fh:
                  fh.write(report)
          print(report)
          PY

      - name: Upload CI JaCoCo visual coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: ci-coverage-visual-summary
          path: ci-coverage-summary.md

      - name: Post or update JaCoCo coverage summary as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('ci-coverage-summary.md', 'utf8');
            const marker = '<!-- healthcore-ci-jacoco-coverage-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing CI JaCoCo coverage PR comment #${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
              core.info('Created new CI JaCoCo coverage PR comment');
            }
