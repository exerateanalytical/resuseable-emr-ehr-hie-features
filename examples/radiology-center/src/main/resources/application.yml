server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: healthcore-example-radiology-center
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthcore_radiology}
    username: ${DB_USER:healthcore}
    password: ${DB_PASSWORD:change_me_local_only}
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/radiology/001-radiology-ris.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
