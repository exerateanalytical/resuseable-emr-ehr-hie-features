server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: healthcore-example-outpatient-emr
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthcore_emr}
    username: ${DB_USER:healthcore}
    password: ${DB_PASSWORD:change_me_local_only}
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/packs/pack-emr-master.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
