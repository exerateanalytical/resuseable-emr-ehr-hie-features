server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: healthcore-example-biobank
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthcore_biobank}
    username: ${DB_USER:healthcore}
    password: ${DB_PASSWORD:change_me_local_only}
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/biobanking/001-biobanking.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
