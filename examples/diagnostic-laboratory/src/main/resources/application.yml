server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: healthcore-example-diagnostic-laboratory
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthcore_lab}
    username: ${DB_USER:healthcore}
    password: ${DB_PASSWORD:change_me_local_only}
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/diagnostics_core/001-diagnostics-core.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
